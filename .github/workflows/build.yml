name: 'Build'

on:
  push:

env:
  MODRINTH_TOKEN: ${{ secrets.PUBLISH_MODRINTH_TOKEN }}
  CURSE_KEY: ${{ secrets.PUBLISH_CURSEFORGE_TOKEN }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Setup
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create changelog
        run: |
          {
            echo 'CHANGELOG<<EOF'
            git log ${{ github.event.before }}...${{ github.event.after }} --pretty=format:"\[[%h](https://github.com/$GITHUB_REPOSITORY/commit/%H)\] %s (%cn)  "
            echo ""
            echo EOF
          } >> "$GITHUB_ENV"
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '25'
          cache: 'gradle'
      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      # Build
      - name: Build with Gradle
        run: ./gradlew clean build
      # Publish
      - name: Publish CurseForge
        run: ./gradlew :NeoForge:publishCurseForge :Fabric:publishCurseForge
      - name: Publish Modrinth
        run: ./gradlew :NeoForge:modrinth :Fabric:modrinth
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          path: output/*[^shadow].jar
